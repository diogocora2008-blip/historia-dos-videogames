
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | História dos Videogames</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #10111b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .navbar, footer {
            background-color: #202238;
        }

        h1, h2 {
            color: #8f7aff;
        }

        .formulario {
            background-color: #202238;
            padding: 30px;
            border-radius: 12px;
        }

        .form-label {
            color: white;
        }

        .form-control {
            background-color: #151626;
            color: white;
            border-color: #555777;
        }

        .form-control:focus {
            background-color: #151626;
            color: white;
            border-color: #8f7aff;
        }

        .form-control::placeholder {
            color: #b8b8cc;
        }

        footer {
            padding: 25px;
            margin-top: 50px;
            text-align: center;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">GameHistória</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
                <li class="nav-item"><a class="nav-link" href="galeria.html">Galeria</a></li>
                <li class="nav-item"><a class="nav-link" href="dados.html">Dados</a></li>
                <li class="nav-item"><a class="nav-link active" href="contato.html">Contato</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-12 col-md-9 col-lg-7">
            <h1 class="mb-3">Entre em contato</h1>
            <p class="mb-4">Envie uma mensagem ou compartilhe sua opinião sobre a história dos videogames.</p>

            <div class="formulario">
                <form id="formContato">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome completo</label>
                        <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="exemplo@email.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="assunto" class="form-label">Assunto</label>
                        <input type="text" class="form-control" id="assunto" name="assunto" placeholder="Sobre o que deseja falar?" required>
                    </div>

                    <div class="mb-3">
                        <label for="mensagem" class="form-label">Mensagem</label>
                        <textarea class="form-control" id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Enviar mensagem</button>

                    <p id="resultado" class="mt-3 mb-0" role="status"></p>
                </form>
            </div>
        </div>
    </div>
</main>

<footer>
    <p class="mb-0">Projeto acadêmico — História dos Videogames</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById("formContato").addEventListener("submit", function(event) {
        event.preventDefault();

        document.getElementById("resultado").textContent =
            "Mensagem registrada para esta demonstração. O formulário não envia e-mails.";

        this.reset();
    });
</script>

</body>
</html>
